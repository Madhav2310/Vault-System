# Vault dev and demo topology. All images pinned; host ports overridable via .env.
name: vault

x-app: &app
  build:
    context: ./backend
    additional_contexts:
      frontend: ./frontend
  image: vault-backend:0.1.0
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}
    REDIS_URL: redis://redis:6379/0
    OBJECT_STORE_ROOT: /data/blobs
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,service.version=${GIT_SHA:-dev}
  volumes:
    - blobs:/data/blobs
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

x-celery-health: &celery-health
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 30s

services:
  api:
    mem_limit: 768m
    cpus: 1.5
    <<: *app
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: vault-api
    ports: ["127.0.0.1:${API_PORT:-8100}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker-ingest:
    mem_limit: 1536m
    cpus: 2
    <<: *app
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: vault-worker-ingest
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "ingest", "-c", "1", "-n", "ingest@%h", "--loglevel", "INFO"]
    healthcheck:
      <<: *celery-health
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d ingest@$$HOSTNAME --timeout 10"]

  worker-ai:
    mem_limit: 768m
    cpus: 1.5
    <<: *app
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: vault-worker-ai
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "ai,maintenance", "-c", "${AI_WORKER_CONCURRENCY:-4}", "-n", "ai@%h", "--loglevel", "INFO"]
    healthcheck:
      <<: *celery-health
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d ai@$$HOSTNAME --timeout 10"]

  beat:
    mem_limit: 128m
    cpus: 0.25
    <<: *app
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: vault-beat
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-s", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    deploy:
      replicas: 1  # exactly one scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    mem_limit: 1g
    cpus: 2
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    # Dev/test only: durability off (fsync, full_page_writes, synchronous_commit) and JIT off make test suites
    # markedly cheaper in CPU and I/O; a crash can lose recent data, which is fine for rebuildable dev data.
    # Memory, sized for mem_limit (page cache counts against it): shared_buffers 25% of the cap, effective_cache_size
    # 75% (shared buffers plus the page cache the rest can hold); work_mem stays 4MB (the largest retrieval sort uses
    # ~1.2MB) and maintenance_work_mem 64MB (3 autovacuum workers x 64MB must fit beside the buffers).
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off", "-c", "jit=off",
              "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "work_mem=4MB",
              "-c", "maintenance_work_mem=64MB"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5442}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    mem_limit: 256m
    cpus: 0.5
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]  # rebuildable state only
    ports: ["127.0.0.1:${REDIS_PORT:-6389}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  otel-lgtm:
    profiles: ["obs", "full"]
    mem_limit: 1g
    cpus: 1
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"   # Tempo HTTP API (scripts/check_trace.py)
    volumes:
      - lgtm:/data
      - ./ops/otel/collector.yaml:/otel-lgtm/otelcol-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  pgbouncer:  # connection pooling for the scale topology (docs/operations.md); not used in dev
    mem_limit: 128m
    cpus: 0.25
    profiles: ["pgbouncer"]
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@postgres:5432/${POSTGRES_DB:-vault}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
    depends_on: [postgres]

volumes:
  pgdata:
  blobs:
  lgtm:
