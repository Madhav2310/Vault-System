# UI test profile (S19.02): the default stack with a scripted fake model (no provider key, no spend).
# Used by `make ui-e2e` as project `vault-uitest` on its own ports, so a running dev stack is untouched:
#   docker compose -p vault-uitest -f docker-compose.yml -f docker-compose.ui-test.yml up -d
# TEST ONLY: `ENVIRONMENT=prod` + `LLM_PROVIDER=fake` refuses to start (Settings validator).
x-fake-env: &fake-env
  LLM_PROVIDER: fake
  UI_SCRIPT_PATH: /srv/ui_script.yaml
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

x-fake-script: &fake-script ./backend/tests/fixtures/ui_script.yaml:/srv/ui_script.yaml:ro

services:
  api:
    image: vault-backend-uitest:0.1.0  # a separate tag: building here never retags the dev stack's image
    environment: *fake-env
    volumes: [*fake-script]
  worker-ingest:
    image: vault-backend-uitest:0.1.0
    environment: *fake-env
    volumes: [*fake-script]
  worker-ai:
    image: vault-backend-uitest:0.1.0
    environment: *fake-env
    volumes: [*fake-script]
  beat:
    image: vault-backend-uitest:0.1.0
