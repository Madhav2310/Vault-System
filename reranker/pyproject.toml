[project]
name = "vault-reranker"
version = "0.1.0"
description = "Cross-encoder rerank service (stub until S2: identity scores)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "uvicorn>=0.32",
]

[tool.uv]
package = false
python-preference = "only-managed"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["app.py", "models.py", "bench.py", "tests"]
