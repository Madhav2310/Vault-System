    sentence_end: 3
  - doc: report_headcount_finance
    sentence_start: 2
    sentence_end: 3
  doc_ids:
  - report_headcount_hr
  - report_headcount_finance
  audit_note: 412 (HR) versus 398 (payroll); neither supersedes the other.
- id: s21-con-14
  stratum: conflict
  question: How fast are staff leaving over the last twelve months?
  source_doc: report_headcount_finance
  answer_type: answer
  audit_status: verified
  required_claims:
  - The People Team reports annualised attrition of 9.4%.
  - Finance reports attrition of 11.0%.
  - The reports disagree and measure attrition differently.
  gold_evidence:
  - doc: report_headcount_hr
    sentence_start: 3
    sentence_end: 4
  - doc: report_headcount_finance
    sentence_start: 3
    sentence_end: 4
  doc_ids:
  - report_headcount_hr
  - report_headcount_finance
  audit_note: '9.4% versus 11.0%; Finance''s measure includes voluntary and involuntary leavers. [S21.05 audit: system_wrong]
    The two reports give different attrition figures and describe different measurement bases: HR annualised attrition versus
    Finance voluntary and involuntary leavers. The disagreement/measurement claim is supported.'
