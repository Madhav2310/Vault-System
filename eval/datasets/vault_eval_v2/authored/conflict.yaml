# S21.03 authored stratum: conflict. Fixture documents: ../docs/manifest.yaml. Evidence = [sentence_start, sentence_end) per ../README.md appendix.
items:
- id: s21-con-01
  stratum: conflict
  question: What hourly charge applies to Vantage's work from February 2026?
  source_doc: consulting_vantage_amend1
  answer_type: answer
  audit_status: verified
  required_claims:
  - From 1 February 2026, the applicable consulting rate is USD 165 per hour under Amendment No. 1.
  gold_evidence:
  - doc: consulting_vantage_amend1
    sentence_start: 3
    sentence_end: 4
  - doc: consulting_vantage_amend1
    sentence_start: 11
    sentence_end: 12
  - doc: consulting_vantage
    sentence_start: 7
    sentence_end: 8
  doc_ids:
  - consulting_vantage
  - consulting_vantage_amend1
  audit_note: 'Contract says USD 140; amendment sets USD 165 and states it replaces the corresponding provision, so the later
    version wins explicitly. [S21.05 audit: gold_wrong] The question asks only for the rate. The original-rate replacement explanation
    is true context but not a required claim for this answer.'
- id: s21-con-02
  stratum: conflict
  question: How long does the Pinecrest and Vantage engagement last once the first amendment is taken into account?
  source_doc: consulting_vantage_amend1
  answer_type: answer
  audit_status: verified
  required_claims:
  - The term is eighteen (18) months from 6 October 2025.
  - This replaces the twelve-month term of the original agreement.
  gold_evidence:
  - doc: consulting_vantage_amend1
    sentence_start: 5
    sentence_end: 6
  - doc: consulting_vantage_amend1
    sentence_start: 11
    sentence_end: 12
  - doc: consulting_vantage
    sentence_start: 5
    sentence_end: 6
  doc_ids:
  - consulting_vantage
  - consulting_vantage_amend1
  audit_note: 'Contract: twelve months; Amendment section 2: eighteen months, and amendment section 5 says sections
    1 and 2 replace the originals.'
- id: s21-con-03
  stratum: conflict
  question: What notice does either side have to give to end the Vantage consulting arrangement?
  source_doc: consulting_vantage_amend1
  answer_type: answer
  audit_status: verified
  required_claims:
  - The original agreement says thirty (30) days' written notice.
  - Amendment No. 1 says forty-five (45) days' written notice.
  - 'The sources conflict: the amendment says only its Sections 1 and 2 replace provisions, so it is unclear whether
    30 or 45 days applies.'
  gold_evidence:
  - doc: consulting_vantage
    sentence_start: 12
    sentence_end: 13
  - doc: consulting_vantage_amend1
    sentence_start: 7
    sentence_end: 8
  - doc: consulting_vantage_amend1
    sentence_start: 11
    sentence_end: 13
  doc_ids:
  - consulting_vantage
  - consulting_vantage_amend1
  audit_note: 'Genuine conflict: amendment section 3 says 45 days but section 5 names only sections 1 and 2 as replacing; a
    good answer flags this rather than picking one. [S21.05 audit: system_wrong] strong model misses c2 (Vault states it); gold
    kept.'
- id: s21-con-04
  stratum: conflict
  question: What percentage of net sales does Granite owe Helios as royalty today?
  source_doc: license_helios_amend2
  answer_type: answer
  required_claims:
  - The royalty is now eight percent (8%) of net sales under the Second Amendment.
  - The original agreement's six percent is superseded because the amendment controls on conflict.
  gold_evidence:
  - doc: license_helios_amend2
    sentence_start: 3
    sentence_end: 4
  - doc: license_helios_amend2
    sentence_start: 9
    sentence_end: 10
  - doc: license_helios
    sentence_start: 7
    sentence_end: 8
  doc_ids:
  - license_helios
  - license_helios_amend2
  audit_note: 'Original: 6%. Second Amendment: 8%, and its precedence clause says it controls.'
- id: s21-con-05
  stratum: conflict
  question: Where may Granite sell products that contain the Helios image library?
  source_doc: license_helios_amend2
  answer_type: answer
  required_claims:
  - After the Second Amendment the licence is valid worldwide, excluding countries under United States export embargoes.
  - The original agreement limited it to the United States and Canada.
  gold_evidence:
  - doc: license_helios_amend2
    sentence_start: 5
    sentence_end: 6
  - doc: license_helios
    sentence_start: 5
    sentence_end: 6
  doc_ids:
  - license_helios
  - license_helios_amend2
  audit_note: 'Original: US and Canada. Amendment: worldwide except embargoed countries; amendment controls.'
- id: s21-con-06
  stratum: conflict
  question: Is Granite allowed to pass the Helios library on to resellers under a sublicence?
  source_doc: license_helios_amend2
  answer_type: answer
  required_claims:
  - Yes, the Second Amendment lets the Licensee sublicense to distributors with the Licensor's prior written consent,
    not unreasonably withheld.
  - The original agreement prohibited any sublicensing.
  gold_evidence:
  - doc: license_helios_amend2
    sentence_start: 7
    sentence_end: 8
  - doc: license_helios
    sentence_start: 9
    sentence_end: 10
  doc_ids:
  - license_helios
  - license_helios_amend2
  audit_note: Original forbids sublicensing; amendment permits it with consent; amendment controls on conflict.
