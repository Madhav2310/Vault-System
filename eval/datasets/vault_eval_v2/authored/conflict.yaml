- id: s21-con-10
  stratum: conflict
  question: How long were people locked out of signing in on 9 September?
  source_doc: report_outage_customer_notice
  answer_type: answer
  audit_status: verified
  required_claims:
  - The engineering post-mortem says 47 minutes (09:12 to 09:59 UTC).
  - The customer notice says 62 minutes.
  - The two documents disagree and no document says which figure is authoritative.
  gold_evidence:
  - doc: report_outage_postmortem
    sentence_start: 2
    sentence_end: 3
  - doc: report_outage_customer_notice
    sentence_start: 2
    sentence_end: 3
  doc_ids:
  - report_outage_postmortem
  - report_outage_customer_notice
  audit_note: '47 versus 62 minutes; neither document supersedes the other. [S21.05 audit: system_wrong] Both durations and
    the fact that the sources conflict are essential to answer this question faithfully. Vault states all three; the proposed
    fix wrongly drops the disagreement claim.'
