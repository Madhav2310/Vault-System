  answer_type: answer
  audit_status: verified
  required_claims:
  - The People Team report gives 412 employees, including 14 part-time staff.
  - The Finance payroll report gives 398 employees, counting each part-timer as one head.
  - The figures differ; the reports use different sources.
  gold_evidence:
