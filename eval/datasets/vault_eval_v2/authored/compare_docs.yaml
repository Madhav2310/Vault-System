# S21.03 authored stratum: compare_docs. Fixture documents: ../docs/manifest.yaml. Evidence = [sentence_start, sentence_end) per ../README.md appendix.
items:
- id: s21-cmp-01
  stratum: compare_docs
  question: Which of Cloudlane's and Northwind's agreements gives the supplier the longer window to report a personal
    data breach?
  source_doc: dpa_cloudlane
  answer_type: answer
  audit_status: verified
  required_claims:
  - Cloudlane's DPA allows 72 hours.
  - The Northwind MSA allows 48 hours.
  - So Cloudlane's window is longer by 24 hours.
  gold_evidence:
  - doc: dpa_cloudlane
    sentence_start: 11
    sentence_end: 12
  - doc: msa_northwind_v2
    sentence_start: 18
    sentence_end: 19
  doc_ids:
  - dpa_cloudlane
  - msa_northwind_v2
- id: s21-cmp-02
  stratum: compare_docs
  question: Which of the Fibrenet line, the Northwind platform and the Quill subscription promises the highest uptime?
  source_doc: sla_fibrenet
  answer_type: answer
  audit_status: verified
  required_claims:
  - Fibrenet commits to 99.95% monthly availability.
  - The Northwind platform commits to 99.5%.
  - Quill targets 99.9%.
  - Fibrenet has the highest commitment.
  gold_evidence:
  - doc: sla_fibrenet
    sentence_start: 6
    sentence_end: 7
  - doc: msa_northwind_v2
    sentence_start: 14
    sentence_end: 15
  - doc: order_quill_v2
    sentence_start: 22
    sentence_end: 23
  doc_ids:
  - sla_fibrenet
  - msa_northwind_v2
  - order_quill_v2
  audit_note: '[S21.05 audit: system_wrong] Vault misses c0,c3; the strong model entails it from the gold evidence; gold kept.'
- id: s21-cmp-03
  stratum: compare_docs
  question: How do the Helios licence and the Cloudlane addendum differ on checking up on the other party?
  source_doc: license_helios
  answer_type: answer
  required_claims:
  - Helios may audit sales records once a year on twenty days' notice.
  - Cloudlane's controller may audit once a year on fourteen days' notice, or at any time after a breach.
  gold_evidence:
  - doc: license_helios
    sentence_start: 14
    sentence_end: 15
  - doc: dpa_cloudlane
    sentence_start: 16
    sentence_end: 17
  doc_ids:
  - license_helios
  - dpa_cloudlane
- id: s21-cmp-04
  stratum: compare_docs
  question: 'Once the relationship ends, who gets customer data back sooner: Quill''s customers or Cloudlane''s?'
  source_doc: order_quill
  answer_type: answer
  required_claims:
  - Cloudlane must delete or return personal data within thirty days after the agreement ends.
  - Quill provides a data export on request during the term and for ninety days afterwards.
  - 'The two work differently: Cloudlane''s deadline is 30 days, Quill''s request window runs 90 days.'
  gold_evidence:
  - doc: dpa_cloudlane
    sentence_start: 19
    sentence_end: 20
  - doc: order_quill_v2
    sentence_start: 20
    sentence_end: 21
  doc_ids:
  - dpa_cloudlane
  - order_quill_v2
- id: s21-cmp-05
