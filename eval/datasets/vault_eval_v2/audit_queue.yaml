    the silver data'
  - 'The answer includes: This silver data is then simply added to our training set, after which the model is retrained'
  gold_evidence:
  - doc: qasper_1805_10824
    sentences: 217-221
    text: 'our semi-supervised approach is quite straight- forward: first a model is trained on the training set and then
      this model is used to predict the labels of the silver data. this silver data is then simply added to our training set,
      after which the model is retrained. however, an extra step is applied to en- sure that the silver data is of reasonable
      quality.'
  vault_answer: |-
    The study uses a semi-supervised approach in which models label silver data, which is then added to the training set before retraining.
    The silver data comes from DISC tweets assigned to emotions when they contain an annotated emotion word.
    To filter for quality, ten models predict each silver instance’s label; the instance is retained only if the highest and lowest predictions differ by no more than a threshold.
    The method applies to the LSTM and feed-forward networks and, because only emotions were annotated, to the emotion-intensity tasks.
  strong_answer: The approach trains a model on the training set, uses it to predict labels for silver data, adds that silver
    data to the training set, and retrains the model. An additional, unspecified step ensures that the silver data is of reasonable
    quality.
