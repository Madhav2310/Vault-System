- id: mig-summarize-qasper_factweet
  stratum: multi_span
  source_doc: qasper_factweet
  question: Summarize the FacTweet paper.
  answer_type: answer
  required_claims:
  - FacTweet aims to detect and profile fake-news Twitter accounts.
  - FacTweet analyzes sequences of tweet chunks using features such as emotions, sentiment and style.
  - The FacTweet approach outperforms baselines.
  gold_evidence: []
  vault_answer: |-
    FacTweet detects non-factual Twitter news accounts by modeling sequences of tweets and their semantic and stylistic features.
    The paper’s premise is that suspicious accounts mix real and misleading news, but may exhibit detectable patterns across their tweet sequences.
    The method sorts tweets by date, divides them into chunks and uses an LSTM with attention to classify them. An account’s label is the majority class of its chunks.
    Its features include emotion, sentiment, morality, style and word embeddings.
    FacTweet achieved 0.74 accuracy and 0.565 macro-F1, outperforming the proposed baselines. Ablation tests found that word embeddings, style and morality contributed most to performance.
