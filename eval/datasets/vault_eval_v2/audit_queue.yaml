  question: What different approaches of encoding syntactic information authors present?
  answer_type: answer
  required_claims:
  - 'The answer includes: dependency head and dependency relation label, denoted as Dep and Rel for short'
  - 'The answer includes: Tree-based Position Feature (TPF) as Dependency Path (DepPath)'
  - 'The answer includes: Shortest Dependency Path (SDP) as Relation Path (RelPath)'
  gold_evidence:
  - doc: qasper_1910_11204
    sentences: 160-161
    text: 3.2 representation of the syntactic dependencies 3.2.1 dependency head & relation the most intuitive way to represent
      syntactic in- formation is to use individual dependency rela- tions directly, like dependency head and depen- dency
      relation label, denoted as dep and rel for short.
  - doc: qasper_1910_11204
    sentences: 164-166
    text: 3.2.2 dependency path & relation path in order to preserve the structural information of dependency trees as much
      as possible, we take the syntactic path between candidate arguments and predicates in dependency trees as linguistic
      knowl- edge. referring to xia et al. (2019), we use the tree-based position feature (tpf) as dependency path (deppath)
      and use the shortest dependency path (sdp) as relation path (relpath).
  vault_answer: |-
    The authors present four representations of syntactic dependencies: DEP, REL, DEPPATH and RELPATH.
    DEPPATH and RELPATH capture more structural information from dependency trees than DEP and REL, but that structural information is more sensitive to tree quality because of error propagation.
    They compare three ways to incorporate syntax into the SRL model: concatenating it to the input embedding, LISA, and their proposed relation-aware method.
    LISA replaces an attention head with syntactic dependency information; the relation-aware method provides a softer way to encode richer structural information.
  strong_answer: 'The authors present four representations of syntactic information: dependency head (dep), dependency relation
    label (rel), dependency path (deppath), and relation path (relpath). For paths between candidate arguments and predicates
    in dependency trees, they use the tree-based position feature (TPF) as the dependency path and the shortest dependency
    path (SDP) as the relation path.'
