    by new facts'
  gold_evidence:
  - doc: qasper_1912_00423
    sentences: 115-118
    text: 'one of the several formats into which fhir can be serialized is rdf. however, because rdf was designed as an abstract
      information model and fhir was designed for operational use in a healthcare setting, there is the potential for a slight
      mismatch between the models. this comes up in two ways: one, rdf makes statements of fact, whereas fhir makes records
      of events.'
  - doc: qasper_1912_00423
    sentences: 119-120
    text: two, rdf is intended to have the property of monotonicity, meaning that previous facts cannot be invalidated by
      new facts.
  vault_answer: |-
    FHIR healthcare resources are serialized as RDF, combining a common healthcare representation with RDF’s query and inference capabilities.
    The engine parses incoming messages into common domain objects, transforms them into RDF graphs of FHIR resources, and stores the statements in a triplestore for querying.
  strong_answer: 'FHIR can be serialized in RDF. However, the models may not align perfectly: RDF was designed as an abstract
    information model that states facts, while FHIR was designed for operational healthcare use and records events; RDF also
    intends monotonicity, meaning new facts cannot invalidate previous facts.'
