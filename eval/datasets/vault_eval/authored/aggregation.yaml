- id: s21-agg-05
  stratum: aggregation
  question: Which of the privacy notice and the hosting addendum says how soon data is wiped, and what are the periods?
  source_doc: privacy_policy
  answer_type: answer
  required_claims:
  - The Pinewood privacy policy removes data within sixty days after account deletion, except invoices kept seven
    years.
  - The Cloudlane DPA requires deletion or return within thirty days after the agreement ends.
  gold_evidence:
  - doc: privacy_policy
    sentence_start: 14
    sentence_end: 15
  - doc: dpa_cloudlane
    sentence_start: 19
    sentence_end: 20
  doc_ids:
  - privacy_policy
  - dpa_cloudlane
