- id: s21-agg-08
  stratum: aggregation
  question: Which of the lab safety SOP, the supplier code and the failover runbook sets a reporting deadline measured
    in hours?
  source_doc: safety_lab
  answer_type: answer
  audit_status: verified
  required_claims:
  - 'Only the lab safety SOP does: incidents must be reported within twenty-four hours.'
  - The supplier code uses five days and the runbook uses five working days.
  gold_evidence:
  - doc: safety_lab
    sentence_start: 18
    sentence_end: 19
  - doc: supplier_code
    sentence_start: 12
    sentence_end: 13
  - doc: runbook_db
    sentence_start: 18
    sentence_end: 19
  doc_ids:
  - safety_lab
  - supplier_code
  - runbook_db
  audit_note: '[S21.05 audit: system_wrong] The lab SOP''s 24-hour incident-reporting deadline is the only deadline measured
    in hours; the supplier code uses five days and the runbook uses five working days. Claim c1 is relevant supporting contrast,
    not an unnecessary claim.'
