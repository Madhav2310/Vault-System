# Authored stratum: aggregation. Fixture documents: ../docs/manifest.yaml. Evidence = [sentence_start, sentence_end) per ../README.md appendix.
items:
- id: s21-agg-01
  stratum: aggregation
  question: Out of the hosting addendum, the fitness app privacy notice and the supplier code, which let the counterparty
    carry out inspections?
  source_doc: dpa_cloudlane
  answer_type: answer
  audit_status: verified
  required_claims:
  - The Cloudlane DPA gives the controller audit rights.
  - The Bramble & Rowe supplier code lets the company audit any site.
  - The Pinewood privacy policy has no audit right.
  gold_evidence:
  - doc: dpa_cloudlane
    sentence_start: 16
    sentence_end: 17
  - doc: supplier_code
    sentence_start: 19
    sentence_end: 20
  doc_ids:
  - dpa_cloudlane
  - privacy_policy
  - supplier_code
  audit_note: '[S21.05 audit: system_wrong] The Cloudlane DPA and supplier code expressly grant audit rights. The full Pinewood
    privacy policy contains no audit right, so the negative comparison is also supported. Vault omits two relevant parts.'
