    sentence_start: 2
    sentence_end: 3
  - doc: report_outage_customer_notice
    sentence_start: 2
    sentence_end: 3
  doc_ids:
  - report_outage_postmortem
  - report_outage_customer_notice
  audit_note: 'False premise: reported duration is 47 or 62 minutes.'
