- id: compare:exclusivity
  source: authored
  category: compare
  doc_ids:
  - cuad_cohosting
  - cuad_endorsement
  - cuad_franchise
  question: Which of my agreements grant exclusivity, and to whom?
  expected_answer: 'the Beyond.com co-hosting agreement: Co-Host shall be the exclusive reseller of           software products
    ("Software") at the Originating Locatio | release released during the Term. | Short Term Product Exclusives. For a period
    of fourteen (14) days           following release of any new NAI Goods or major version releases           (i.e., version
    3.0 to 4.0) of existing NAI Goods, Co-Host shall be the           exclusive online seller of any such; the Pey Dirt endorsement
    agreement: Pey Dirt expressly agrees that the right to use Manning Identification will not be granted to anyone other
    than Company for use within the Contract Territory during the Contract Period in connection with the advertisement, promotion
    and sale of Products. | Pey Dirt grants to Company the exclusive right and license to use Manning Identification within
    the Contract Territory during the Contract Period in connection with the advertisement and promotion by Company of Products
    in television, radio, print and point of purchase.; the Simplicity Esports franchise agreement: Except as provided in
    the next sentence, the license granted herein shall be exclusive. | "Exclusivity" shall mean that Franchisor shall not
    grant any further licenses to third parties in the Trademarks for use in connection with Smaaash Centres in the Territory,
    and the Franchisee shall not enter into any arrangement or agreement with any third parties for establishing or operating
    any gaming and entertainment centres identical or similar to Smaaash Centres, in the Territory except as otherwise provided
    in this Agreement; provided, however, that Franchisor may continue to use the Trademarks in the Territory in connection
    with the operation of Franchisor''s entertainment centers already set up as of the Effective Date in the Territory. The
    restriction contained in this Agreement shall apply on the parties throughout the Term. | Subject to Section 1.2, Franchisor
    hereby grants to Franchisee the exclusive right, (a) to establish and operate Smaaash Centres in the Territory, (b) to
    sub-license the right to establish and operate Smaaash Centres to third party franchisees in and for the Territory, (c)
    a license to use the products and other services developed by Franchisor with respect to the Smaaash Centres (including
    a right to authorise the use of products and services developed by the Franchisor by third party franchisees), in the
    Territory, and (d) to identify third party franchisees for the Smaaash Centres in the Territory.'
  answer_type: free
