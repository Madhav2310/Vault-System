  reference_abstract: We present an approach to detect fake news in Twitter at the account level using a neural recurrent
    model and a variety of different semantic and stylistic features. Our method extracts a set of features from the timelines
    of news Twitter accounts by reading their posts as chunks, rather than dealing with each tweet independently. We show
    the experimental benefits of modeling latent stylistic signatures of mixed fake and real news with a sequential model
    over a wide range of strong baselines.
