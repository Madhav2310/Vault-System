  question: Compare which jurisdiction's law governs the Medalist consulting agreement, the Pey Dirt endorsement agreement
    and the Entertainment Gaming Asia distributor agreement.
  expected_answer: 'the Medalist consulting agreement: This Agreement shall be interpreted, construed, governed, and enforced
    according to the laws of the Commonwealth of Virginia, without giving effect to its conflict of laws principles.; the
    Pey Dirt endorsement agreement: This Agreement shall be governed and construed according to the law of Tennessee.; the
    Entertainment Gaming Asia distributor agreement: This Agreement shall be governed by, construed in accordance with the
    laws of Ontario, Canada.'
  answer_type: free
