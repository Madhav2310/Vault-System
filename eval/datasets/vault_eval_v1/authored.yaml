- id: compare:renewal
  source: authored
  category: compare
  doc_ids:
  - cuad_consulting
  - cuad_distributor
  - cuad_license
  question: Which of my agreements renew automatically, and for how long?
  expected_answer: 'the Medalist consulting agreement: Term: twelve (12) months from the date of the Agreement which term
    shall automatically renew for an additional twelve (12) months on such date if the Agreement is not otherwise terminated
    according to Section 8 of the Agreement.; the Entertainment Gaming Asia distributor agreement: As provided for in this
    Section 1, the term of this Agreement shall be for a period of five (5) years, beginning on the Effective Date (the "Initial
    Term"); provided, however, the Initial Term shall be subject to automatic successive renewal terms of three (3) years
    each (the "Renewal Terms" and together with the Initial Term, the "Term").; the GPAQ license agreement: Thereafter, the
    agreement shall automatically renew for successive five (5)-year terms, unless either Party gives written notice to the
    other Party of intent not to renew at least six (6) months prior to the expiration of the then-current Term. | If either
    party elects not to renew the Agreement and the other party wishes to continue the Agreement, the Parties shall attempt
    in good faith to negotiate an amendment to the Agreement to renew the Term on such terms as may be negotiated by the Parties.'
  answer_type: free
  gold:
  - quote: 'Term: twelve (12) months from the date of the Agreement which term shall automatically renew for an additional
      twelve (12) months on such date if the Agreement is not otherwise terminated according to Section 8 of the Agreement.'
    page: 8
    match: exact
    score: 100
    doc_id: cuad_consulting
  - quote: As provided for in this Section 1, the term of this Agreement shall be for a period of five (5) years, beginning
      on the Effective Date (the "Initial Term"); provided, however, the Initial Term shall be subject to automatic successive
      renewal terms of three (3) years each (the "Renewal Terms" and together with the Initial Term, the "Term").
    page: 1
    match: exact
    score: 100
    doc_id: cuad_distributor
  - quote: Thereafter, the agreement shall automatically renew for successive five (5)-year terms, unless either Party gives
      written notice to the other Party of intent not to renew at least six (6) months prior to the expiration of the then-current
      Term.
    page: 8
    match: exact
    score: 100
    doc_id: cuad_license
  - quote: If either party elects not to renew the Agreement and the other party wishes to continue the Agreement, the Parties
      shall attempt in good faith to negotiate an amendment to the Agreement to renew the Term on such terms as may be negotiated
      by the Parties.
    page: 8
    match: exact
    score: 100
    doc_id: cuad_license
  expected_coverage: supported
  grading: judge
  status: draft
  dimensions:
  - renewal
