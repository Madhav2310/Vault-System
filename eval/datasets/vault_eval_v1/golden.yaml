  question: How are chunks defined?
  expected_answer: Chunks is group of tweets from single account that  is consecutive in time - idea is that this group can
    show secret intention of malicious accounts.
  answer_type: free
  gold:
  - quote: Given a news Twitter account, we read its tweets from the account's timeline. Then we sort the tweets by the posting
      date in ascending way and we split them into $N$ chunks. Each chunk consists of a sorted sequence of tweets labeled
      by the label of its corresponding account.
    page: 2
    match: fuzzy
    score: 99.3
  - quote: Consequently, we investigate ways to detect suspicious accounts by considering their tweets in groups (chunks).
      Our hypothesis is that suspicious accounts have a unique pattern in posting tweet sequences. Since their intention is
      to mislead, the way they transition from one set of tweets to the next has a hidden signature, biased by their intentions.
      Therefore, reading these tweets in chunks has the potential to improve the detection of the fake news accounts.
    page: 1
    match: fuzzy
    score: 99.3
  expected_coverage: supported
  grading: judge
