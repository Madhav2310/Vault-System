- id: qasper_factweet:q4
  source: QASPER
  category: lookup
  doc_ids:
  - qasper_factweet
  question: What features are extracted?
  expected_answer: Sentiment; Morality; Style; Words embeddings
  answer_type: free
  gold:
  - quote: 'Features. We argue that different kinds of features like the sentiment of the text, morality, and other text-based
      features are critical to detect the nonfactual Twitter accounts by utilizing their occurrence during reporting the news
      in an account''s timeline. We employ a rich set of features borrowed from previous works in fake news, bias, and rumors
      detection,,,.


      [leftmargin=4mm]


      Emotion: We build an emotions vector using word occurrences of 15 emotion types from two available emotional lexicons.
      We use the NRC lexicon, which contains $\sim $14K words labeled using the eight Plutchik''s emotions. The other lexicon
      is SentiSense which is a concept-based affective lexicon that attaches emotional meanings to concepts from the WordNet
      lexical database. It has $\sim $5.5 words labeled with emotions from a set of 14 emotional categories We use the categories
      that do not exist in the NRC lexicon.


      Sentiment: We extract the sentiment of the tweets by employing EffectWordNet, SenticNet, NRC, and subj_lexicon, where
      each has the two sentiment classes, positive and negative.


      Morality: Features based on morality foundation theory where words are labeled in one of the following 10 categories
      (care, harm, fairness, cheating, loyalty, betrayal, authority, subversion, sanctity, and degradation).


      Style: We use canonical stylistic features, such as the count of question marks, exclamation marks, consecutive characters
      and letters, links, hashtags, users'' mentions. In addition, we extract the uppercase ratio and the tweet length.


      Words embeddings: We extract words embeddings of the words of the tweet using $Glove\-840B-300d$ pretrained model. The
      tweet final representation is obtained by averaging its words embeddings.'
    page: 2
    match: fuzzy
    score: 99.3
  expected_coverage: supported
  grading: judge
  status: draft
