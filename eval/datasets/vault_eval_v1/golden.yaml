- id: qasper_factweet:q2
  source: QASPER
  category: lookup
  doc_ids:
  - qasper_factweet
  question: What baselines do they compare to?
  expected_answer: LR + Bag-of-words; Tweet2vec; LR + All Features (tweet-level); LR + All Features (chunk-level); FacTweet
    (tweet-level); Top-$k$ replies, likes, or re-tweets
  answer_type: free
  gold:
  - quote: 'Baselines. We compare our approach (FacTweet) to the following set of baselines:


      [leftmargin=4mm]


      LR + Bag-of-words: We aggregate the tweets of a feed and we use a bag-of-words representation with a logistic regression
      (LR) classifier.


      Tweet2vec: We use the Bidirectional Gated recurrent neural network model proposed in. We keep the default parameters
      that were provided with the implementation. To represent the tweets, we use the decoded embedding produced by the model.
      With this baseline we aim at assessing if the tweets'' hashtags may help detecting the non-factual accounts.


      LR + All Features (tweet-level): We extract all our features from each tweet and feed them into a LR classifier. Here,
      we do not aggregate over tweets and thus view each tweet independently.


      LR + All Features (chunk-level): We concatenate the features'' vectors of the tweets in a chunk and feed them into a
      LR classifier.


      FacTweet (tweet-level): Similar to the FacTweet approach, but at tweet-level; the sequential flow of the tweets is not
      utilized. We aim at investigating the importance of the sequential flow of tweets.


      Top-$k$ replies, likes, or re-tweets: Some approaches in rumors detection use the number of replies, likes, and re-tweets
      to detect rumors. Thus, we extract top $k$ replied, liked or re-tweeted tweets from each account to assess the accounts
      factuality. We tested different $k$ values between 10 tweets to the max number of tweets from each account. Figure shows
      the macro-F1 values for different $k$ values. It seems that $k=500$ for the top replied tweets achieves the highest
      result. Therefore, we consider this as a baseline.'
    page: 4
    match: fuzzy
    score: 94.7
  expected_coverage: supported
  grading: judge
  status: draft
