  gold:
  - quote: 'Next, we analyze why they do not perform well in this task and with this data:


      [noitemsep,leftmargin=*]


      Noisy data. A major challenge of this task is the discrepancy between annotations due to subjective judgement. Although
      this affects also detection using only text, its repercussion is bigger in more complex tasks, such as detection using
      images or multimodal detection.


      Complexity and diversity of multimodal relations. Hate speech multimodal publications employ a lot of background knowledge
      which makes the relations between visual and textual elements they use very complex and diverse, and therefore difficult
      to learn by a neural network.


      Small set of multimodal examples. Fig. shows some of the challenging multimodal hate examples that we aimed to detect.
