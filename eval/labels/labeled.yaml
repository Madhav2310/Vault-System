  split: test
  failed: false
  question: How did they gather the data?
  answer: 'They gathered the data using simulated conversations, which crowd workers then paraphrased
    into natural dialogue.

    The simulator generated dialogue outlines as sequences of user and system actions. Slot values were
    replaced with randomly selected variations, kept consistent across user turns in a dialogue.

    Action templates converted the actions into utterances, which were concatenated for each turn. One
    crowd worker paraphrased all utterances in each dialogue to maintain naturalness and coherence.

    Workers repeated slot values exactly, allowing the researchers to check paraphrases and automatically
    identify slot spans. Other simulator annotations, including dialogue states, were preserved, so no
    further annotation was needed.

    The researchers used conversational flows from MultiWOZ 2.0 and WOZ2.0 as guidelines when developing
    the simulator.'
