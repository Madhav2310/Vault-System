  answer: 'WiSeBE is designed to be more reliable because it evaluates a system against multiple references
    while accounting for agreement among them.

    This matters because spoken-language sentence boundaries can be ambiguous and human annotators can
    disagree; relying on a single reference may therefore give a misleading assessment.

