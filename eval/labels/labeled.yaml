  question: What classification approaches were experimented for this task?
  answer: 'The experiments compared two ways to label input sentences for extractive classification: a
    ROUGE threshold and a top-m ranking.

    The threshold approach labels sentences as “summary” when their ROUGE score exceeds a threshold t;
    the top-m approach labels the m highest-scoring sentences as “summary”.

    The score used for labelling was ROUGE-SU4 F1 against the set of reference summaries.

    The classifier predicts “summary” or “not summary” for each sentence. If fewer than n sentences are
    selected, a backoff selects the n sentences with the highest predicted values.

    The experiments used Support Vector Classification and also reported neural-network classification
    results. The top-5 labelling scheme gave better results than the threshold scheme and was used in
    subsequent classifier-based experiments.

    For the 2019 challenge, classification approaches were also experimented with and without reinforcement
    learning.'
