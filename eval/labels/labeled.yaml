- pair_id: pub_single_span_e16bd25931:1fa85553
  item_id: pub_single_span_e16bd25931
  stratum: single_span
  source_doc: qasper_1912_00819
  split: dev
  failed: false
  question: How were dialogue act labels defined?
  answer: 'Dialogue act labels were defined using the Dialogue Act Markup in Several Layers (DAMSL) tag
    set, as used in the Switchboard Dialogue Act corpus.

    DAMSL assigns dialogue acts forward-looking functions, such as statements, questions and thanking,
    and backward-looking functions, such as accepting, rejecting and answering.

    The tag set distinguishes question types by their forward functions as well as their syntax. For example,
    a yes-no question (qy) expects a yes (ny) or no (nn) answer.

    DAMSL supports labels for whole utterances and utterance segments, although utterances in the emotion
    datasets were not segmented.'
  segments:
  - text: Dialogue act labels were defined using the Dialogue Act Markup in Several Layers (DAMSL) tag
      set, as used in the Switchboard Dialogue Act corpus.
    passages:
    - 'We have investigated the annotation method and trained our

      neural models with the Switchboard Dialogue Act (SwDA)

      Corpus (Godfrey et al., 1992; Jurafsky et al., 1997). The

      SwDA corpus is annotated with the DAMSL tag set, and

      it has been used for reporting and bench-marking state-of-

      the-art results in dialogue act recognition tasks (Stolcke et

      al., 2000; Kalchbrenner et al., 2016; Bothe et al., 2018c)

      which makes it ideal for our use case.'
  - text: DAMSL assigns dialogue acts forward-looking functions, such as statements, questions and thanking,
      and backward-looking functions, such as accepting, rejecting and answering.
    passages:
    - 'Accord-

      ing to DAMSL, each DA has a forward-looking function

      (such as Statement, Info-request, Question, Thanking) and

      a backward-looking function (such as Accept, Reject, An-


      swer) (Allen and Core, 1997).'
  - text: The tag set distinguishes question types by their forward functions as well as their syntax.
      For example, a yes-no question (qy) expects a yes (ny) or no (nn) answer.
    passages:
    - 'DAMSL distinguishes wh-

      question (qw), yes-no question (qy), open-ended (qo), and

      or-question (qr) classes, not just because these questions

      are syntactically distinct, but also because they have dif-

      ferent forward functions (Jurafsky, 1997).'
    - 'For example, qy

      is used for a question that, from a discourse perspective,

      expects a Yes (ny) or No (nn) answer.'
  - text: DAMSL supports labels for whole utterances and utterance segments, although utterances in the
      emotion datasets were not segmented.
    passages:
    - 'The DAMSL annotation includes not only the utterance-

      level but also segmented-utterance labelling. However, in

      the emotion datasets, the utterances are not segmented.'
  required_claims:
  - 'The answer includes: Dialogue Act Markup in Several Layers (DAMSL) tag set'
  claim_labels:
  - null
  support_labels:
