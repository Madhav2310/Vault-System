# Retrieval configuration. The file name is the config version: changing any value means a new file; results
# and cache keys carry the version. retrieval@3 keeps the global top 12 and, for multi-document scopes, adds
# each document's own top 6 chunks; the evidence budget is 8,000 tokens.
version: retrieval@3
k_vec: 40                # exact cosine search: candidates from the vector list
k_lex: 40                # candidates from the lexical list
per_doc_quota: 12        # no document contributes more than this many vector candidates (cross-document queries)
per_doc_evidence: 6      # multi-document scopes: each document contributes its own top 6 chunks to the evidence
rrf_k: 60                # reciprocal rank fusion constant
id_boost: 2              # weight of identifier matches (must equal fusion.ID_BOOST)
rerank:
  kind: none
  window_words: 180
  model: Xenova/ms-marco-MiniLM-L-6-v2
  candidates: 20         # fused candidates sent to the reranker
  top_n: 12              # chunks kept after reranking
expansion:
  enabled: true
  max_evidence_tokens: 8000
cache_ttl_s: 3600
gate:
  high: 0.0              # placeholder (the high-confidence skip is not implemented)
  floor: 0.3803             # top_score below this abstains without generating; set by `python -m eval.calibrate_gate --write`
  enabled: false        # off: on answers it refused 3 of 44 answerable train items (S17.13 RCA); `--write` turns the gate on together with a calibrated floor
