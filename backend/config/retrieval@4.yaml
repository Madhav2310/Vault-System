# Retrieval configuration (design §7). The file name is the config version: changing any value means a new
# file; results and cache keys carry the version. retrieval@4 = retrieval@2-llm with a deeper rerank pool
# (50 fused candidates, the listwise reranker sees all of them) and no per-document vector quota on a
# one-document scope; the evidence size is unchanged (top 8 chunks).
version: retrieval@4
k_vec: 40                # exact cosine search: candidates from the vector list
k_lex: 40                # candidates from the lexical list
per_doc_quota: 12        # no document contributes more than this many vector candidates (cross-document queries)
single_doc_full_k: true  # one-document scope: no per-document vector quota (the list is k_vec long)
rrf_k: 60                # reciprocal rank fusion constant
id_boost: 2              # weight of identifier matches (must equal fusion.ID_BOOST)
rerank:
  kind: llm
  window_words: 180
  model: llm-listwise      # informational: the role comes from the rerank prompt (fast)
  candidates: 50         # fused candidates sent to the reranker
  top_n: 8               # chunks kept after reranking
expansion:
  enabled: true
  max_evidence_tokens: 4000
cache_ttl_s: 3600
gate:
  high: 0.0              # placeholder (the high-confidence skip is not implemented)
  floor: 0.0             # top_score below this abstains without generating; set by `python -m eval.calibrate_gate --write`
  enabled: false         # `--write` turns the gate on together with a calibrated floor
