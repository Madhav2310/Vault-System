[project]
name = "vault"
version = "0.1.0"
description = "Evidence-first document intelligence (case study)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "celery-types>=0.26.0",
]

[tool.uv]
# Never probe Homebrew/system interpreters (a Homebrew python@3.13 probe crashed on 2026-11-12)
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
files = ["app"]

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, no external services",
    "integration: needs compose services (postgres, redis)",
    "e2e: full stack via HTTP",
    "live: calls real provider APIs (excluded from ci)",
]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true
