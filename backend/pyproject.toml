[project]
name = "vault"
version = "0.1.0"
description = "Evidence-first document intelligence (case study)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-celery>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.28",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "celery-types>=0.26.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261111",
]
eval = [
    "pdfplumber>=0.11,<0.12",
    "pillow>=13.0",
    "pypdf>=7.0",
    "pypdfium2>=5.15",
    "python-docx>=1.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "reportlab>=5.1",
]

[tool.uv]
# Never probe Homebrew/system interpreters (a Homebrew python@3.13 probe crashed on 2026-11-12)
python-preference = "only-managed"
# eval: corpus build + fixture generator; its tests run in `make test`, so sync it by default
default-groups = ["dev", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
files = ["app"]

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, no external services",
    "integration: needs compose services (postgres, redis)",
    "e2e: full stack via HTTP",
    "live: calls real provider APIs (excluded from ci)",
]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
